<div class="min-h-screen lg:flex" [class.lg:flex-row-reverse]="language() === 'ar'">
 <app-sidebar
    [collapsed]="sidebarCollapsed"
    [mobileOpen]="mobileOpen"
    (closeMobile)="closeMobileMenu()"
    (collapseToggled)="toggleCollapse()"
  />
 
  <div class="flex-1 flex flex-col min-w-0">
    <app-header 
      [pageTitle]="pageTitle()"
      (toggleMenu)="onHamburger()"
      (editProfile)="openEditProfile()"
      (logout)="onLogout()"
    />

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (editProfileOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-ink/40" (click)="editProfileOpen = false"></div>
    <div class="relative bg-paper rounded-2xl shadow-soft border border-inkText/8 w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <p class="font-display text-xl text-inkText">Edit Profile</p>
        <button type="button" class="p-1.5 rounded-lg text-fog hover:bg-ink/5" (click)="editProfileOpen = false">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <p class="text-sm text-fog">
        Profile editing (name, contact details and permission summary) goes here — wire this
        up to your user service the same way <code>ItemsService</code> backs the Items view.
      </p>
    </div>
  </div>
}
