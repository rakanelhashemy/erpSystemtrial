<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-ink/55 backdrop-blur-sm" (click)="cancel()"></div>

  <div class="relative bg-paper w-full max-w-md rounded-2xl shadow-soft"
       role="dialog" aria-modal="true" aria-labelledby="business-modal-title">
    <div class="flex items-center justify-between px-6 py-5 border-b border-inkText/8">
      <p id="business-modal-title" class="font-display text-xl text-inkText">
        {{ isEdit() ? 'Edit Business' : 'Add Business' }}
      </p>
      <button type="button" class="p-2 rounded-lg hover:bg-ink/5 text-fog"
              aria-label="Close business modal" (click)="cancel()">×</button>
    </div>

    <form class="px-6 py-6 space-y-5" novalidate (ngSubmit)="save()">
      <div class="field" [class.has-error]="nameError()">
        <input id="business-name" type="text" placeholder=" " required name="name"
               [ngModel]="name()" (ngModelChange)="name.set($event); nameError.set(false)" />
        <label for="business-name">Business Name</label>
      </div>
      @if (nameError()) {
        <p class="text-xs text-danger -mt-3" role="alert">Business name is required.</p>
      }
      @if (error()) {
        <p class="text-xs text-danger -mt-3" role="alert">{{ error() }}</p>
      }

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-inkText/8">
        <button type="button" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-fog hover:bg-ink/5"
                (click)="cancel()">Cancel</button>
        <button type="submit" [disabled]="saving()"
                class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-ink text-ivory hover:bg-ink2 shadow-soft disabled:opacity-40">
          {{ saving() ? 'Saving…' : 'Save Business' }}
        </button>
      </div>
    </form>
  </div>
</div>
