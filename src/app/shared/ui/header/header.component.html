<header
  [attr.dir]="language === 'ar' ? 'rtl' : 'ltr'"
  class="h-16 shrink-0 bg-paper/90 backdrop-blur border-b border-inkText/8 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="p-2 rounded-lg cursor-pointer hover:bg-ink/5 text-inkText"
      [attr.aria-label]="language === 'ar' ? 'تبديل القائمة' : 'Toggle menu'"
      (click)="toggleMenu.emit()"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <div class="leading-tight">
      <p class="font-display text-lg text-inkText">{{ localizedPageTitle }}</p>
      <p class="hidden sm:block text-[11px] text-fog">{{ branding.companyName() }}</p>
    </div>
  </div>

  <div class="flex items-center gap-4">
  <div class="hidden md:flex flex-col leading-tight" [class.items-end]="language !== 'ar'" [class.items-start]="language === 'ar'">
  <span class="text-[11px] text-fog">{{ role() || '—' }}</span>
  <span class="text-[11px] font-semibold text-granted"
     >
    {{ language === 'ar' ? '● متصل' : '● Online' }}
  </span>
</div>






    
    <div class="relative">
      <button
        type="button"
        class="flex items-center cursor-pointer gap-2 pl-1 pr-2.5 py-1 rounded-full border border-inkText/10 hover:border-brass/50 transition-colors"
        (click)="dropdownOpen = !dropdownOpen"
      >
        <span class="w-8 h-8 rounded-full bg-ink text-brassLt flex items-center justify-center font-display text-sm">
          {{ initial() }}
        </span>
        <span class="hidden sm:block text-sm font-semibold text-inkText">
          {{ user()?.fullName }}
        </span>
        <svg class="w-3.5 h-3.5 text-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (dropdownOpen) {
        <div class="absolute mt-2 w-60 bg-paper rounded-xl shadow-soft border border-inkText/8 overflow-hidden z-40" [class.right-0]="language !== 'ar'" [class.left-0]="language === 'ar'">
          <div class="px-4 py-3 border-b border-inkText/8">
            <p class="text-sm font-semibold text-inkText">{{ user()?.fullName }}</p>
            <p class="text-xs text-fog truncate">{{ user()?.email }}</p>
            <p class="text-xs text-fog">{{ role() }} · {{ branding.companyName() }}</p>
          </div>

          <button
            type="button"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-inkText hover:bg-ivory"
            [class.text-left]="language !== 'ar'" [class.text-right]="language === 'ar'"
            (click)="onEditProfile()"
          >
            <svg class="w-4 h-4 text-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
            {{ language === 'ar' ? 'تعديل الملف الشخصي' : 'Edit Profile' }}
          </button>

          <button
            type="button"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-danger hover:bg-dangerBg"
            [class.text-left]="language !== 'ar'" [class.text-right]="language === 'ar'"
            (click)="onLogout()"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            {{ language === 'ar' ? 'تسجيل الخروج' : 'Logout' }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
