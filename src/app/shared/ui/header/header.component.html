<header
  class="h-16 shrink-0 bg-paper/90 backdrop-blur border-b border-inkText/8 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="p-2 rounded-lg cursor-pointer hover:bg-ink/5 text-inkText"
      aria-label="Toggle menu"
      (click)="toggleMenu.emit()"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <div class="leading-tight">
      <p class="font-display text-lg text-inkText">{{ pageTitle }}</p>
      <p class="text-[11px] text-fog sm:block">{{ branding.companyName() }}</p>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <div class=" md:flex flex-col items-end leading-tight">
      <span class="text-[11px] text-fog">Front Desk</span>
      <span class="text-[11px] text-granted font-semibold">● Online</span>
    </div>

    <div class="relative">
      <button
        type="button"
        class="flex items-center cursor-pointer gap-2 pl-1 pr-2.5 py-1 rounded-full border border-inkText/10 hover:border-brass/50 transition-colors"
        (click)="dropdownOpen = !dropdownOpen"
      >
        <span class="w-8 h-8 rounded-full bg-ink text-brassLt flex items-center justify-center font-display text-sm">A</span>
        <span class=" sm:block text-sm font-semibold text-inkText">{{ userName }}</span>
        <svg class="w-3.5 h-3.5 text-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (dropdownOpen) {
        <div class="absolute right-0 mt-2 w-60 bg-paper rounded-xl shadow-soft border border-inkText/8 overflow-hidden z-40">
          <div class="px-4 py-3 border-b border-inkText/8">
            <p class="text-sm font-semibold text-inkText">{{ userName }}</p>
            <p class="text-xs text-fog">General Manager · {{ branding.companyName() }}</p>
          </div>
          <button
            type="button"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-inkText hover:bg-ivory text-left"
            (click)="editProfile.emit(); dropdownOpen = false"
          >
            <svg class="w-4 h-4 text-fog" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
            Edit Profile
          </button>
          <button
            type="button"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-danger hover:bg-dangerBg text-left"
            (click)="logout.emit()"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
